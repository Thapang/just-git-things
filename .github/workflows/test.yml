name: Tests
on:
  push:
    branches: [main]
  pull_reuest:
    branches: [main]

jobs:
  test:
    run-on: ubuntu-latest
    steps:
      -uses: action/checkout@v4
      -uses: action/setup-python@v5
      with:
          python-version: "3.12"
      -run: pip install pytest
      -run: pytest          